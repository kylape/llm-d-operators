# One-shot install: CRDs + RBAC + in-cluster manager. After this the
# operators run in the llm-d-operators-system namespace and no local
# binary is needed.
#
#   kubectl apply -k config/default
#
# Requires the manager image to exist in a registry the cluster can
# pull (see config/manager).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../crd
  - ../rbac
  - ../manager
