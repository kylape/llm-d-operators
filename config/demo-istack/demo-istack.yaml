apiVersion: v1
kind: Namespace
metadata:
  name: llm-d-operators-istack
  annotations:
    # Platform-admin contracts: the default Router for InferenceStacks
    # with `routing: {}`, and the default Gateway for ModelServers
    # with no explicit gateway.
    serving.llm-d.ai/default-router: demo-router
    serving.llm-d.ai/default-gateway: demo-gateway
---
# A placeholder Gateway object. A real deployment runs a Gateway API
# implementation (Envoy Gateway, agentgateway, ...) behind it; the
# operators only ever reference the Gateway, never create one.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gateway
  namespace: llm-d-operators-istack
spec:
  gatewayClassName: example
  listeners:
  - name: http
    port: 80
    protocol: HTTP
---
# The namespace's default Router. It stays inert until the stack's
# ModelServer creates the InferencePool that links to it.
apiVersion: routing.llm-d.ai/v1alpha1
kind: Router
metadata:
  name: demo-router
  namespace: llm-d-operators-istack
spec:
  replicas: 1
---
# The convenience path: `routing: {}` resolves demo-router from the
# namespace annotation. The controller renders:
#   Deployment qwen3 (engine, GPU count derived from parallelism)
#   ModelServer qwen3 (workload ref → Deployment, owned)
# and the ModelServer in turn renders the InferencePool + HTTPRoute.
#
# NOTE: the baked-in runtime catalog maps vllm to the
# llm-d-inference-sim DEMO STAND-IN (ghcr.io/llm-d/llm-d-inference-sim)
# so this runs on any cluster; apply the config/samples runtime-catalog
# ConfigMap to this namespace first for real vLLM flags. The GPU
# request (nvidia.com/gpu = 1) is derived either way.
apiVersion: serving.llm-d.ai/v1alpha1
kind: InferenceStack
metadata:
  name: qwen3
  namespace: llm-d-operators-istack
spec:
  model:
    uri: hf://Qwen/Qwen3-32B
  runtime: vllm
  replicas: 1
  parallelism:
    tensor: 1
  routing: {}
---
# A plain workload: no routing → only the Deployment is rendered, no
# ModelServer, pool or route. The deterministic labels
# (serving.llm-d.ai/inference-stack, app) let a hand-authored
# ModelServer target it later.
apiVersion: serving.llm-d.ai/v1alpha1
kind: InferenceStack
metadata:
  name: llama31
  namespace: llm-d-operators-istack
spec:
  model:
    uri: hf://meta-llama/Llama-3.1-8B-Instruct
  runtime: vllm
  replicas: 2
  parallelism:
    tensor: 1
