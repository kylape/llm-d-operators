# Runtime catalog override: runtime name → image + base args.
#
# Without this ConfigMap the operator falls back to its baked-in
# default, whose vllm entry is a DEMO STAND-IN pointing at
# ghcr.io/llm-d/llm-d-inference-sim (a GPU-free vLLM simulator that
# accepts --model/--port instead of vLLM flags). To run real vLLM,
# apply this ConfigMap to the namespace first.
#
# Catalog args support two placeholders, substituted by the
# controller: {model} → model.name (default metadata.name) and
# {tensor} → parallelism.tensor. spec.engine.args are appended AFTER
# these (argparse last-wins).
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-d-runtime-catalog
data:
  catalog.json: |
    {
      "vllm": {
        "image": "vllm/vllm-openai:v0.11.0",
        "args": [
          "--model", "{model}",
          "--port", "8000",
          "--tensor-parallel-size", "{tensor}"
        ]
      }
    }
