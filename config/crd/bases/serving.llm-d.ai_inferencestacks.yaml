                      is pinned: operator upgrades do not change it.
                    minLength: 1
                    type: string
                type: object
              model:
                description: Model to serve.
                properties:
                  name:
                    description: |-
                      Name is the model name exposed to clients (vLLM's
                      served-model-name). Defaults to metadata.name.
                    minLength: 1
                    type: string
                  uri:
                    description: |-
                      URI of the model to serve: an HF repo id, an s3:// or gs://
                      prefix, or whatever the runtime's model loader accepts.
                    minLength: 1
                    type: string
                required:
                - uri
                type: object
              parallelism:
                description: |-
                  Parallelism of one engine replica. The GPU count is derived
                  from tensor and never declared elsewhere.
                properties:
                  data:
                    description: |-
                      Data is the data-parallel degree. Schema-reserved: rejected by
                      the controller in v0; how ranks map to pools is a joint design
                      with the pool schema.
                    minimum: 1
                    type: integer
                  pipeline:
                    description: |-
                      Pipeline is the pipeline-parallel degree. Schema-reserved:
                      rejected by the controller in v0 (multi-node workloads arrive
                      with LeaderWorkerSet support).
                    minimum: 1
                    type: integer
                  tensor:
                    description: |-
                      Tensor is the tensor-parallel degree. The GPU count per replica
                      is ALWAYS derived from it (spec.resources has no GPU field);
                      nvidia.com/gpu request/limit = tensor regardless of catalog or
                      overrides.
                    minimum: 1
                    type: integer
                required:
                - tensor
                type: object
              replicas:
                description: Replicas of the engine workload. Defaults to 1.
                format: int32
                minimum: 0
                type: integer
              resources:
                description: |-
                  Resources for the engine container. There is deliberately no
                  GPU count field: nvidia.com/gpu request/limit is always derived
                  from parallelism.tensor, and an explicit GPU quantity here is
                  overwritten by the derived value.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              routing:
                description: |-
                  Routing attaches the workload to a Router. Omitted: plain
                  workload, no routing objects rendered. Empty ({}): the
                  namespace's default Router. Explicit routerRef: that Router.
                properties:
                  routerRef:
                    description: |-
                      RouterRef names the Router whose EPP serves this stack. When
                      omitted, the namespace's default-router annotation
                      (serving.llm-d.ai/default-router) is used.
                    minLength: 1
                    type: string
                type: object
              runtime:
                description: |-
                  Runtime names the serving engine. The controller resolves it to
                  an image and base args through its runtime catalog (ConfigMap
                  llm-d-runtime-catalog in the namespace overrides the built-in
                  catalog). v0 supports vllm only.
                enum:
                - vllm
                type: string
            required:
            - model
            - parallelism
            - runtime
            type: object
          status:
            description: InferenceStackStatus defines the observed state of InferenceStack.
            properties:
              conditions:
                description: Conditions of the InferenceStack.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deploymentName:
                description: DeploymentName is the engine Deployment rendered by this
                  stack.
                type: string
              modelServerName:
                description: |-
                  ModelServerName is the ModelServer rendered when routing is
                  set, wiring the Deployment into a Router.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation most recently reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
