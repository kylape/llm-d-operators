---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: modelservers.serving.llm-d.ai
spec:
  group: serving.llm-d.ai
  names:
    kind: ModelServer
    listKind: ModelServerList
    plural: modelservers
    shortNames:
    - ms
    singular: modelserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .spec.workload.name
      name: Workload
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ModelServer wires one model-server workload (a Deployment, later
          LeaderWorkerSet or DisaggregatedSet) into inference-aware routing:
          it owns the InferencePool and the HTTPRoute that join the workload
          to a Router's EPP and a Gateway. ModelServers are created directly
          (bring-your-own workload) or owned by an InferenceStack.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ModelServerSpec defines the desired state of ModelServer: the wiring
              of one model-server workload into inference-aware routing. The
              ModelServer creates the InferencePool (selector derived from the
              workload) and the HTTPRoute (backendRef to the pool, parentRef to a
              Gateway), or joins an existing pool via poolRef (shared-pool mode).
              It never creates the Gateway itself.
            properties:
              gateway:
                description: |-
                  Gateway names the Gateway the HTTPRoute attaches to. When
                  omitted, the namespace's default gateway annotation
                  (serving.llm-d.ai/default-gateway) is used. When neither is set,
                  no HTTPRoute is created and RouteReady reports
                  GatewayNotConfigured.
                minLength: 1
                type: string
              hostname:
                description: |-
                  Hostname for the HTTPRoute. When omitted the route matches all
                  hostnames the Gateway listener accepts.
                minLength: 1
                type: string
              poolRef:
                description: |-
                  PoolRef names an existing InferencePool to join instead of
                  creating one (shared-pool mode: N model servers behind one
                  Router-owned pool). The referenced pool must exist and its
                  selector must match the referenced workload's selector; the
                  HTTPRoute backendRef points at the referenced pool. When unset,
                  this ModelServer creates and owns its pool.
                minLength: 1
                type: string
              routerRef:
                description: |-
                  RouterRef names the Router whose EPP serves this model server.
                  The pool's endpointPickerRef points at that Router's Service.
                minLength: 1
                type: string
              targetPort:
                description: |-
                  TargetPort is the engine container port that the pool routes to.
                  Defaults to 8000.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              workload:
                description: Workload to wire into routing.
                properties:
                  apiVersion:
                    description: APIVersion of the referenced workload.
                    enum:
                    - apps/v1
                    type: string
                  kind:
                    description: |-
                      Kind of the referenced workload. v0 supports Deployment;
                      LeaderWorkerSet and DisaggregatedSet arrive with multi-node
                      support.
                    enum:
                    - Deployment
                    type: string
                  name:
                    description: Name of the referenced workload, in the same namespace.
                    minLength: 1
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
            required:
            - routerRef
            - workload
            type: object
          status:
            description: ModelServerStatus defines the observed state of ModelServer.
            properties:
              conditions:
                description: Conditions of the ModelServer.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              eppServiceName:
                description: EPPServiceName is the EPP Service the pool points at.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation most recently reconciled.
                format: int64
                type: integer
              poolName:
                description: |-
                  PoolName is the name of the InferencePool owned by this
                  ModelServer.
                type: string
              routeName:
                description: |-
                  RouteName is the name of the HTTPRoute owned by this
                  ModelServer, when one is rendered.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
