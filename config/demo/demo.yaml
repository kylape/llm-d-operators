apiVersion: v1
kind: Namespace
metadata:
  name: llm-d-operators-demo
  annotations:
    serving.llm-d.ai/default-gateway: demo-gateway
---
# The BYO workload: a GPU-free vLLM simulator, two replicas so the
# pool has two endpoints. The ModelServer derives the pool selector
# from this Deployment's own selector — nothing is maintained by hand.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-sim
  namespace: llm-d-operators-demo
  labels:
    app: vllm-sim
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-sim
  template:
    metadata:
      labels:
        app: vllm-sim
    spec:
      containers:
      - name: vllm-sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.2
        imagePullPolicy: IfNotPresent
        args: ["--model", "sim-qwen", "--port", "8000"]
        ports:
        - containerPort: 8000
          name: http
---
# A placeholder Gateway object. A real deployment runs a Gateway API
# implementation (Envoy Gateway, agentgateway, ...) behind it; the
# operators only ever reference the Gateway, never create one.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gateway
  namespace: llm-d-operators-demo
spec:
  gatewayClassName: example
  listeners:
  - name: http
    port: 80
    protocol: HTTP
---
apiVersion: routing.llm-d.ai/v1alpha1
kind: Router
metadata:
  name: demo-router
  namespace: llm-d-operators-demo
spec:
  replicas: 1
---
apiVersion: serving.llm-d.ai/v1alpha1
kind: ModelServer
metadata:
  name: sim-qwen
  namespace: llm-d-operators-demo
spec:
  workload:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-sim
  routerRef: demo-router
  targetPort: 8000
