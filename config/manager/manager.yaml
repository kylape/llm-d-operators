apiVersion: v1
kind: Namespace
metadata:
  name: llm-d-operators-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: manager
  namespace: llm-d-operators-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager
  namespace: llm-d-operators-system
  labels:
    app.kubernetes.io/name: llm-d-operators
    app.kubernetes.io/component: manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-d-operators
      app.kubernetes.io/component: manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-d-operators
        app.kubernetes.io/component: manager
    spec:
      serviceAccountName: manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: ghcr.io/llm-d/llm-d-operators:dev
        imagePullPolicy: IfNotPresent
        args:
        - --leader-elect
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
---
# Binds the generated manager-role ClusterRole (config/rbac) to the
# manager ServiceAccount. Apply config/rbac first, or use
# config/default which composes both.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: manager-role
subjects:
- kind: ServiceAccount
  name: manager
  namespace: llm-d-operators-system
