apiVersion: v1
kind: Namespace
metadata:
  name: llm-d-operators-shared
  annotations:
    serving.llm-d.ai/default-gateway: demo-gateway
---
# A placeholder Gateway object. A real deployment runs a Gateway API
# implementation (Envoy Gateway, agentgateway, ...) behind it; the
# operators only ever reference the Gateway, never create one.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gateway
  namespace: llm-d-operators-shared
spec:
  gatewayClassName: example
  listeners:
  - name: http
    port: 80
    protocol: HTTP
---
# The shared Router: spec.pool declares the InferencePool it owns
# upfront (<name>-pool), so the Router activates immediately instead
# of waiting for a ModelServer-created pool to link. The pool selector
# is the platform admin's label contract: any workload pod carrying
# llm-d.ai/shared-pool=true is a backend of this pool.
apiVersion: routing.llm-d.ai/v1alpha1
kind: Router
metadata:
  name: shared-router
  namespace: llm-d-operators-shared
spec:
  replicas: 1
  pool:
    selector:
      llm-d.ai/shared-pool: "true"
    targetPort: 8000
---
# Two model-server workloads sharing the pool label. Each keeps its
# own app label so the Deployments own disjoint pods; the shared label
# is what joins them to the pool.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-sim-a
  namespace: llm-d-operators-shared
  labels:
    app: vllm-sim-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-sim-a
      llm-d.ai/shared-pool: "true"
  template:
    metadata:
      labels:
        app: vllm-sim-a
        llm-d.ai/shared-pool: "true"
    spec:
      containers:
      - name: vllm-sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.2
        imagePullPolicy: IfNotPresent
        args: ["--model", "sim-qwen-a", "--port", "8000"]
        ports:
        - containerPort: 8000
          name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-sim-b
  namespace: llm-d-operators-shared
  labels:
    app: vllm-sim-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-sim-b
      llm-d.ai/shared-pool: "true"
  template:
    metadata:
      labels:
        app: vllm-sim-b
        llm-d.ai/shared-pool: "true"
    spec:
      containers:
      - name: vllm-sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.2
        imagePullPolicy: IfNotPresent
        args: ["--model", "sim-qwen-b", "--port", "8000"]
        ports:
        - containerPort: 8000
          name: http
---
# Two ModelServers joining the shared pool via poolRef: each validates
# that the pool's selector matches its workload's selector and points
# its HTTPRoute at the shared pool. Neither creates a pool of its own
# — one EPP, one pool, four backend pods.
apiVersion: serving.llm-d.ai/v1alpha1
kind: ModelServer
metadata:
  name: sim-qwen-a
  namespace: llm-d-operators-shared
spec:
  workload:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-sim-a
  routerRef: shared-router
  poolRef: shared-router-pool
---
apiVersion: serving.llm-d.ai/v1alpha1
kind: ModelServer
metadata:
  name: sim-qwen-b
  namespace: llm-d-operators-shared
spec:
  workload:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-sim-b
  routerRef: shared-router
  poolRef: shared-router-pool
